# punktfunk system groups + acardace membership, applied by systemd-sysusers
# (systemd-sysusers.service, Before=sysinit.target).
#
# Lives here rather than in the punktfunk package %%post (which runs at image build
# time): bootc-image-builder/Anaconda regenerate /etc/group from the kickstart at
# install time, so build-time groups never reach the host. The service re-runs on
# fresh installs and after image updates (ConditionNeedsUpdate=|/etc); `sudo
# systemd-sysusers` re-applies it on demand.
#
# `punktfunk` gates the virtual Steam Deck pad's usbip vhci attach node (and the
# managed Gaming Mode display-manager takeover); without acardace's membership the
# Deck pad falls back to UHID, which Steam ignores. `punktfunk-update` is the empty
# opt-in group the web console checks to authorize updates.
g punktfunk
g punktfunk-update
m acardace punktfunk
