name: "Build Fedora Gaming bootc images"

env:
  IMAGE_NAME: "fedora-gaming"
  REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  PRIVATE_REGISTRY: "registry.canederli.org"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Containerfile'
      - 'Containerfile.amd'
      - 'Containerfile.nvidia'
      - 'rootfs/**'
      - 'host-scripts/**'
      - 'spec_files/**'
      - '.github/workflows/image.yml'
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
      - 'Containerfile.amd'
      - 'Containerfile.nvidia'
      - 'rootfs/**'
      - 'host-scripts/**'
      - 'spec_files/**'
      - '.github/workflows/image.yml'
  schedule:
    - cron: '0 0 */2 * *'

permissions:
  contents: read
  packages: write

# Prevent multiple workflow runs from racing to ensure that pushes are made
# sequentially for the main branch. Also cancel in progress workflow runs for
# pull requests only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which files changed so we can skip unnecessary builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.filter.outputs.base }}
      amd: ${{ steps.filter.outputs.amd }}
      nvidia: ${{ steps.filter.outputs.nvidia }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            base:
              - 'Containerfile'
              - 'rootfs/**'
              - 'host-scripts/**'
              - 'spec_files/**'
              - '.github/workflows/image.yml'
            amd:
              - 'Containerfile.amd'
            nvidia:
              - 'Containerfile.nvidia'

  # Build the base image (GPU-agnostic)
  # Only rebuilds when base files change, on schedule, or manual dispatch.
  # AMD/NVIDIA-only changes reuse the existing base image from the registry.
  build-base:
    needs: changes
    if: >-
      needs.changes.outputs.base == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build base image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: base
          containerfiles: Containerfile
          layers: true
          oci: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push base image to GHCR
        uses: redhat-actions/push-to-registry@v2
        if: github.event_name != 'pull_request'
        with:
          image: ${{ env.IMAGE_NAME }}
          registry: ${{ env.REGISTRY }}
          tags: base
          extra-args: --format=oci

      - name: Login to registry.canederli.org
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: registry.canederli.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push base image to registry.canederli.org
        uses: redhat-actions/push-to-registry@v2
        if: github.event_name != 'pull_request'
        with:
          image: ${{ env.IMAGE_NAME }}
          registry: registry.canederli.org
          tags: base
          extra-args: --format=oci

  # Build AMD GPU image
  build-amd:
    needs: [changes, build-base]
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to registry.canederli.org
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: registry.canederli.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build AMD image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}-amd
          tags: latest ${{ github.sha }}
          containerfiles: Containerfile.amd
          build-args: BASE_IMAGE=${{ env.PRIVATE_REGISTRY }}/${{ env.IMAGE_NAME }}:base
          layers: true
          oci: true

      - name: Push AMD image to registry.canederli.org
        uses: redhat-actions/push-to-registry@v2
        if: github.event_name != 'pull_request'
        with:
          image: ${{ env.IMAGE_NAME }}-amd
          registry: registry.canederli.org
          tags: latest ${{ github.sha }}
          extra-args: --format=oci

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push AMD image to GHCR
        uses: redhat-actions/push-to-registry@v2
        if: github.event_name != 'pull_request'
        with:
          image: ${{ env.IMAGE_NAME }}-amd
          registry: ${{ env.REGISTRY }}
          tags: latest ${{ github.sha }}
          extra-args: --format=oci

  # Build NVIDIA GPU image
  build-nvidia:
    needs: [changes, build-base]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.build-base.result != 'failure' &&
      (needs.changes.outputs.base   == 'true' ||
       needs.changes.outputs.nvidia == 'true' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to registry.canederli.org
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: registry.canederli.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build NVIDIA image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}-nvidia
          tags: latest ${{ github.sha }}
          containerfiles: Containerfile.nvidia
          build-args: BASE_IMAGE=${{ env.PRIVATE_REGISTRY }}/${{ env.IMAGE_NAME }}:base
          layers: true
          oci: true

      - name: Push NVIDIA image to registry.canederli.org
        uses: redhat-actions/push-to-registry@v2
        if: github.event_name != 'pull_request'
        with:
          image: ${{ env.IMAGE_NAME }}-nvidia
          registry: registry.canederli.org
          tags: latest ${{ github.sha }}
          extra-args: --format=oci

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push NVIDIA image to GHCR
        uses: redhat-actions/push-to-registry@v2
        if: github.event_name != 'pull_request'
        with:
          image: ${{ env.IMAGE_NAME }}-nvidia
          registry: ${{ env.REGISTRY }}
          tags: latest ${{ github.sha }}
          extra-args: --format=oci
